name: Tests

"on":
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      JOBBOT_MODE: manual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install PDF tools and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils fonts-dejavu-core
          python -m pip install -r requirements.txt
          python -c "import typst; print('Typst renderer available')"
      - name: Fixed writing and salary regression corpora
        run: python -m pytest -q tests/test_regression_corpora.py --junitxml=corpus-results.xml
      - name: Test
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-python-${{ matrix.python }}
          path: |
            test-results.xml
            corpus-results.xml
