mode: manual        # manual = no API key; AI steps become out/tasks/*.task.md for Claude Code. api = call the Anthropic API

# role -> model mapping. Every agent reads this file and falls back to
# DEFAULTS in agents/core.py if a role is missing.
# A role may be a plain model id, or {model: ..., effort: low|medium|high|xhigh|max}.
# Check current model names and pricing in each provider's docs before changing.

discovery_parse: claude-haiku-4-5-20251001     # fast, cheap extraction
fit:
  model: claude-sonnet-5
  effort: medium
writing:                                       # judgment + prose
  model: claude-opus-5-5
  effort: high
outreach:
  model: claude-opus-5-5
  effort: high
review_lead:
  model: claude-opus-5-5
  effort: high
reviewers:                                     # diversity is the point
  - {model: claude-sonnet-5, effort: high}
  - {model: claude-opus-5-5, effort: medium}
  # Non-Anthropic reviewers are not wired up yet; entries that don't start
  # with "claude-" are skipped with a warning.
  # - <second-provider-model>
